name: Staging Build

on:
  push:
    branches: [develop]

concurrency:
  group: staging-deploy
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: us-central1

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit || echo "Type check failed, continuing..."
        continue-on-error: true

      - name: Test Cloud Functions
        working-directory: ./functions
        run: |
          npm ci
          npm test

  build-functions:
    name: Build Cloud Functions
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Build Cloud Functions
        working-directory: ./functions
        run: |
          npm ci
          npm run build

  build-web:
    name: Build Web Container
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure GCP credentials
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker gcr.io --quiet

      - name: Build and Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: |
            gcr.io/${{ env.GCP_PROJECT_ID }}/web:${{ github.sha }}
            gcr.io/${{ env.GCP_PROJECT_ID }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Terraform Deploy
    runs-on: ubuntu-latest
    needs: [build-functions, build-web]
    steps:
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: terraform-apply
          client-payload: |
            {
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "web_image_tag": "${{ github.sha }}"
            }

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- Functions built" >> $GITHUB_STEP_SUMMARY
          echo "- Web image: gcr.io/${{ env.GCP_PROJECT_ID }}/web:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Terraform will deploy all changes" >> $GITHUB_STEP_SUMMARY
          echo "- URL: https://${{ env.GCP_PROJECT_ID }}-web.a.run.app" >> $GITHUB_STEP_SUMMARY
