name: Terraform Apply

on:
  push:
    branches:
      - develop
    paths:
      - 'terraform/**'
  pull_request:
    branches:
      - develop
    paths:
      - 'terraform/**'
  workflow_dispatch:
  repository_dispatch:
    types: [terraform-apply]

permissions:
  contents: read
  pull-requests: write

env:
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: us-central1
  TF_VAR_domain_name: ${{ vars.GCP_PROJECT_ID }}.web.app
  TF_VAR_web_image_tag: ${{ github.event.client_payload.web_image_tag || 'latest' }}

jobs:
  terraform:
    name: Terraform Plan/Apply
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.*'

      - name: Configure GCP credentials
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: ./terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan -no-color
        continue-on-error: true

      - name: Terraform Plan Summary
        if: always() && steps.plan.outcome == 'success'
        working-directory: ./terraform
        run: terraform show -no-color tfplan

      - name: Apply on push to develop
        if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

      - name: Apply on Repository Dispatch
        if: github.event_name == 'repository_dispatch'
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

      - name: Apply on workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

      - name: Terraform Outputs
        if: always()
        working-directory: ./terraform
        run: terraform output

      - name: Comment PR with plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('./terraform/tfplan', 'utf8');

            const output = `#### Terraform Plan 📖

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${plan}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Upload Terraform plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan
          retention-days: 30
