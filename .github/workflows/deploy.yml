name: Deploy

on:
  push:
    branches: [main, develop]
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy-staging:
    if: github.ref == 'refs/heads/develop'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://finventory-dev.web.app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Firebase (staging)
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions,firestore:rules,storage:rules --project finventory-dev
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  deploy-production:
    if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://finventory-prod.web.app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Firebase (production)
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions,firestore:rules,storage:rules --project finventory-prod
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
