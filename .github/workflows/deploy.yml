name: Deploy

on:
  push:
    branches: [main, develop]
    tags: ['v*']

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  GCP_REGION: us-central1

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Install and build functions
        run: |
          cd functions
          npm ci
          npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13.14.0

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@v2.6.0
        with:
          args: deploy --only functions,firestore:rules,storage:rules --project finventory-dev
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deployment Summary
        run: |
          echo "## Staging Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://api.finventory.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Install and build functions
        run: |
          cd functions
          npm ci
          npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13.14.0

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@v2.6.0
        with:
          args: deploy --only functions,firestore:rules,storage:rules --project finventory-prod
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deployment Summary
        run: |
          echo "## Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Ref: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
