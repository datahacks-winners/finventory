name: Production Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  GCP_REGION: us-central1
  GCP_PROJECT_ID: finventory-prod

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit || echo "Type check failed, continuing..."
        continue-on-error: true

      - name: Test Cloud Functions
        working-directory: ./functions
        run: |
          npm ci
          npm test

  build-functions:
    name: Build Cloud Functions
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Build Cloud Functions
        working-directory: ./functions
        run: |
          npm ci
          npm run build

  build-web:
    name: Build Web Container
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY_PROD }}'

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: |
            us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/web-images/web:${{ github.sha }}
            us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/web-images/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
            VITE_PEXELS_API_KEY=${{ secrets.VITE_PEXELS_API_KEY_PROD }}

  deploy-cloud-run:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [build-functions, build-web]
    environment:
      name: production
      url: https://finventory-prod-web-${GCP_REGION}-a.run.app
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY_PROD }}'

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy finventory-prod-web \
            --image us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/web-images/web:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars=NODE_ENV=production

  deploy-firebase:
    name: Deploy Firebase Rules & Functions
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_PROD }}

      - name: Install and build functions
        run: |
          cd functions
          npm ci
          npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13.14.0

      - name: Deploy Firestore Rules
        if: ${{ hashFiles('firestore.rules') != '' }}
        run: firebase deploy --only firestore:rules --project ${{ env.GCP_PROJECT_ID }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Deploy Storage Rules
        if: ${{ hashFiles('storage.rules') != '' }}
        run: firebase deploy --only storage --project ${{ env.GCP_PROJECT_ID }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Deploy Cloud Functions
        run: firebase deploy --only functions --project ${{ env.GCP_PROJECT_ID }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN_PROD }}

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-cloud-run, deploy-firebase]
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "## Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Ref: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Web: https://finventory-prod-web-${GCP_REGION}-a.run.app" >> $GITHUB_STEP_SUMMARY
          echo "- Functions: Firebase Cloud Functions" >> $GITHUB_STEP_SUMMARY
