name: Production Deploy

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: finventory-api-prod

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit || true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci
      - run: npm run build

  deploy-firebase:
    name: Deploy Firebase Rules
    runs-on: ubuntu-latest
    needs: [test, build]
    environment:
      name: production
      url: https://api.finventory.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCLOUD_AUTH_KEY }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore Rules
        if: hashFiles('firestore.rules') != ''
        run: firebase deploy --only firestore:rules --project finventory-prod
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Deploy Storage Rules
        if: hashFiles('storage.rules') != ''
        run: firebase deploy --only storage --project finventory-prod
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Deploy Cloud Functions
        if: hashFiles('functions/package.json') != ''
        run: |
          cd functions
          npm ci
          npm run build
          firebase deploy --only functions --project finventory-prod
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

  deploy-cloud-run:
    name: Deploy Cloud Run (Production)
    runs-on: ubuntu-latest
    needs: [test, build]
    environment:
      name: production
      url: https://api.finventory.app
    steps:
      - uses: actions/checkout@v4

      - name: Check for Dockerfile
        id: check-dockerfile
        run: |
          if [ -f "apps/api/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to GCP
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCLOUD_AUTH_KEY }}

      - name: Set up Cloud SDK
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: finventory-prod

      - name: Configure Docker
        if: steps.check-dockerfile.outputs.exists == 'true'
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Container
        if: steps.check-dockerfile.outputs.exists == 'true'
        run: |
          IMAGE_TAG=${{ env.GCP_REGION }}-docker.pkg.dev/finventory-prod/finventory/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
          docker build -t $IMAGE_TAG ./apps/api
          docker push $IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        if: steps.check-dockerfile.outputs.exists == 'true'
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image ${{ env.IMAGE_TAG }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --no-allow-unauthenticated \
            --set-env-vars NODE_ENV=production

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-firebase, deploy-cloud-run]
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "## Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Ref: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
