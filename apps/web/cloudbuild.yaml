steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "FIREBASE_API_KEY is set: $$FIREBASE_API_KEY"
        docker build \
          --build-arg VITE_FIREBASE_API_KEY="$$FIREBASE_API_KEY" \
          --build-arg VITE_FIREBASE_AUTH_DOMAIN="$$FIREBASE_AUTH_DOMAIN" \
          --build-arg VITE_FIREBASE_PROJECT_ID="$$FIREBASE_PROJECT_ID" \
          --build-arg VITE_FIREBASE_STORAGE_BUCKET="$$FIREBASE_STORAGE_BUCKET" \
          --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="$$FIREBASE_MESSAGING_SENDER_ID" \
          --build-arg VITE_FIREBASE_APP_ID="$$FIREBASE_APP_ID" \
          --build-arg VITE_API_URL="${_API_URL}" \
          -t us-central1-docker.pkg.dev/finventory-1776558252/web-images/web:latest \
          .
    dir: 'apps/web'
    secretEnv:
      - 'FIREBASE_API_KEY'
      - 'FIREBASE_AUTH_DOMAIN'
      - 'FIREBASE_PROJECT_ID'
      - 'FIREBASE_STORAGE_BUCKET'
      - 'FIREBASE_MESSAGING_SENDER_ID'
      - 'FIREBASE_APP_ID'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'web'
      - '--image'
      - 'us-central1-docker.pkg.dev/finventory-1776558252/web-images/web:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--project'
      - 'finventory-1776558252'

availableSecrets:
  secretManager:
    - versionName: projects/finventory-1776558252/secrets/firebase-api-key/versions/latest
      env: 'FIREBASE_API_KEY'
    - versionName: projects/finventory-1776558252/secrets/firebase-auth-domain/versions/latest
      env: 'FIREBASE_AUTH_DOMAIN'
    - versionName: projects/finventory-1776558252/secrets/firebase-project-id/versions/latest
      env: 'FIREBASE_PROJECT_ID'
    - versionName: projects/finventory-1776558252/secrets/firebase-storage-bucket/versions/latest
      env: 'FIREBASE_STORAGE_BUCKET'
    - versionName: projects/finventory-1776558252/secrets/firebase-messaging-sender-id/versions/latest
      env: 'FIREBASE_MESSAGING_SENDER_ID'
    - versionName: projects/finventory-1776558252/secrets/firebase-app-id/versions/latest
      env: 'FIREBASE_APP_ID'

images:
  - 'us-central1-docker.pkg.dev/finventory-1776558252/web-images/web:latest'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _API_URL: "https://api-eodwatsp5q-uc.a.run.app"
