steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/calcofi-inference:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/calcofi-inference:latest'
      - '.'

  # Push the container image to GCR
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/calcofi-inference:$SHORT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/calcofi-inference:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'calcofi-inference'
      - '--image'
      - 'gcr.io/$PROJECT_ID/calcofi-inference:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '10'
      - '--max-instances'
      - '5'

images:
  - 'gcr.io/$PROJECT_ID/calcofi-inference:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/calcofi-inference:latest'

options:
  logging: CLOUD_LOGGING_ONLY
